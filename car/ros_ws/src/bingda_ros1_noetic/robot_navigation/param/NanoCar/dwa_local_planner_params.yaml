DWAPlannerROS:
  # Robot max/min velocity
  max_vel_x: 0.15
  min_vel_x: -0.10
  max_vel_trans: 0.15
  min_vel_trans: 0.0        # 改 0.0，允许停下

  max_vel_theta: 0.4
  min_vel_theta: 0.0        # 改 0.0，允许原地慢转

  acc_lim_x: 0.3
  acc_lim_y: 0.0
  acc_lim_theta: 0.3

  # Goal Tolerance
  xy_goal_tolerance: 0.25   # 稍微放宽
  yaw_goal_tolerance: 0.35
  latch_xy_goal_tolerance: false

  # Forward Simulation
  sim_time: 1.0             # 缩短预测时长
  vx_samples: 10
  vy_samples: 0
  vtheta_samples: 20
  controller_frequency: 10.0

  # Trajectory Scoring
  path_distance_bias: 32.0
  goal_distance_bias: 18.0
  occdist_scale: 0.02
  forward_point_distance: 0.325
  stop_time_buffer: 0.3
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  # Oscillation Prevention
  oscillation_reset_dist: 0.1  # 改 0.1，更容易摆脱震荡

  # Debugging
  publish_traj_pc : true
  publish_cost_grid_pc: true

  prune_plan: false
  use_dwa: true
  restore_defaults: false
