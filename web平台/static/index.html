<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园快递配送站 · 车机协同</title>
<style>
/* ============================================================
   两套主题：默认菜鸟驿站风（亮色），可一键切到深色工业风
   ★ 只用 CSS 变量，一套结构两套配色
   ============================================================ */
body[data-theme="cainiao"]{
  --bg:#f2f3f5; --card:#fff; --card2:#fafbfc; --line:#e8eaed;
  --fg:#1f2329; --fg2:#8a919e; --primary:#00a0e9; --primary-d:#0086c9;
  --ok:#00b578; --warn:#ff8f1f; --err:#f5222d; --info:#00a0e9;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --head:linear-gradient(135deg,#00a0e9,#0086c9); --headfg:#fff;
}
body[data-theme="dark"]{
  --bg:#0f1115; --card:#1a1d23; --card2:#15181d; --line:#2a2f38;
  --fg:#e6e6e6; --fg2:#8b949e; --primary:#1f6feb; --primary-d:#2b7bf3;
  --ok:#3fb950; --warn:#d29922; --err:#f85149; --info:#58a6ff;
  --shadow:none; --head:#1a1d23; --headfg:#e6e6e6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);transition:background .2s,color .2s;
     font:14px/1.55 -apple-system,"Microsoft YaHei","PingFang SC",sans-serif}

/* ---------------- 顶部栏 ---------------- */
header{background:var(--head);color:var(--headfg);padding:13px 20px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:9;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
header .logo{font-size:17px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
header .search{flex:1;max-width:340px;display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.18);border-radius:20px;padding:6px 14px;
  color:var(--headfg)}
body[data-theme="dark"] header .search{background:var(--card2);border:1px solid var(--line)}
header .search input{background:none;border:none;outline:none;color:var(--headfg);
  font-size:13px;width:100%}
header .search input::placeholder{color:rgba(255,255,255,.65)}
body[data-theme="dark"] header .search input::placeholder{color:var(--fg2)}
header .acts{margin-left:auto;display:flex;gap:8px}
header button{background:rgba(255,255,255,.2);color:var(--headfg);border:none;
  border-radius:16px;padding:6px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap}
header button:hover{background:rgba(255,255,255,.32)}
body[data-theme="dark"] header button{background:var(--card2);border:1px solid var(--line)}
body[data-theme="dark"] header button:hover{border-color:var(--primary)}

.wrap{padding:16px 20px 26px;max-width:1320px;margin:0 auto}

/* ---------------- 数据条 ---------------- */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;box-shadow:var(--shadow)}
.stat .num{font-size:25px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .lab{font-size:12px;color:var(--fg2);margin-top:3px}
.stat.a .num{color:var(--primary)} .stat.b .num{color:var(--warn)}
.stat.c .num{color:var(--info)}    .stat.d .num{color:var(--ok)}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ---------------- 布局 ---------------- */
.grid{display:grid;grid-template-columns:400px 1fr;gap:16px;align-items:start}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
.card>h2{font-size:13.5px;font-weight:600;padding:12px 15px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:7px;background:var(--card2)}
.card>h2 .cnt{margin-left:auto;font-size:11.5px;color:var(--fg2);font-weight:400}
.card .body{padding:14px 15px}

/* ---------------- ★ 货架（菜鸟驿站的核心） ---------------- */
.racks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rack{border:2px dashed var(--line);border-radius:10px;padding:13px 8px;text-align:center;
  transition:.18s;background:var(--card2)}
.rack .rn{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.rack .ri{font-size:23px;margin:5px 0 3px;opacity:.35}
.rack .rd{font-size:11.5px;color:var(--fg2)}
.rack.occ{border-style:solid;border-color:var(--warn);background:rgba(255,143,31,.07)}
.rack.occ .ri{opacity:1}
.rack.occ .rd{color:var(--warn);font-weight:600}
.rack.free .rd{color:var(--ok)}
.rack:hover{transform:translateY(-2px)}

/* ---------------- 设备 ---------------- */
.dev{display:flex;align-items:center;justify-content:space-between;
  padding:9px 2px;border-bottom:1px solid var(--line)}
.dev:last-child{border-bottom:none}
.dev .dn{font-weight:600;font-size:13px}
.dev .dr{font-size:11.5px;color:var(--fg2);margin-left:5px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.dot.idle{background:var(--ok)} .dot.busy{background:var(--warn)} .dot.off{background:var(--fg2)}

/* ---------------- ★ 包裹卡片 ---------------- */
.parcels{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px}
.parcel{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card2);
  transition:.18s;cursor:default}
.parcel:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--primary)}
.parcel .ph{display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--line);background:var(--card)}
.parcel .pid{font-weight:700;font-size:13px}
.parcel .st{margin-left:auto;font-size:11px;padding:2px 9px;border-radius:11px;
  font-weight:600;white-space:nowrap}
.st.DONE{background:rgba(0,181,120,.12);color:var(--ok)}
.st.PENDING_PICK,.st.DISPATCHED{background:rgba(255,143,31,.14);color:var(--warn)}
.st.PICKING,.st.DELIVERING{background:rgba(0,160,233,.13);color:var(--info)}
.st.FAILED{background:rgba(245,34,45,.12);color:var(--err)}
.parcel .pb{padding:11px 12px}
.parcel .code{font-size:16px;font-weight:700;letter-spacing:1.5px;
  font-variant-numeric:tabular-nums;color:var(--primary);margin-bottom:7px}
.parcel .meta{font-size:12px;color:var(--fg2);display:flex;gap:10px;flex-wrap:wrap}
.parcel .meta b{color:var(--fg);font-weight:600}

/* ---------------- 操作区 ---------------- */
.ops{display:flex;gap:8px;flex-wrap:wrap}
input,select,button.b{background:var(--card2);color:var(--fg);border:1px solid var(--line);
  border-radius:7px;padding:8px 11px;font-size:12.5px;outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--primary)}
button.b{cursor:pointer;transition:.15s}
button.b:hover{border-color:var(--primary)}
button.b.p{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
button.b.p:hover{background:var(--primary-d)}

/* ---------------- 事件 ---------------- */
.log{font-size:12px;max-height:190px;overflow-y:auto}
.log div{padding:5px 0;border-bottom:1px solid var(--line);color:var(--fg2);
  display:flex;gap:9px}
.log div:last-child{border-bottom:none}
.log .t{color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap}
.log .ev{color:var(--fg);font-weight:600}
.log .dv{color:var(--info)}

.empty{color:var(--fg2);font-size:12.5px;text-align:center;padding:22px 0}
.foot{text-align:center;color:var(--fg2);font-size:11.5px;margin-top:20px}
</style>
</head>
<body data-theme="cainiao">

<header>
  <div class="logo">📦 校园快递配送站</div>
  <div class="search">🔍 <input id="q" placeholder="搜包裹号 / 库位，如 T0002 或 1A"></div>
  <div class="acts">
    <button onclick="toggleTheme()" id="thbtn">🌙 深色</button>
    <button onclick="load();loadEvents()">🔄 刷新</button>
  </div>
</header>

<div class="wrap">

  <!-- 数据条 -->
  <div class="stats">
    <div class="stat a"><div class="num" id="m-dev">-</div><div class="lab">在线设备</div></div>
    <div class="stat b"><div class="num" id="m-queue">-</div><div class="lab">待取包裹</div></div>
    <div class="stat c"><div class="num" id="m-total">-</div><div class="lab">累计包裹</div></div>
    <div class="stat d"><div class="num" id="m-done">-</div><div class="lab">已送达</div></div>
    <div class="stat d"><div class="num" id="m-avg">-</div><div class="lab">平均耗时</div></div>
  </div>

  <div class="grid">
    <!-- 左列 -->
    <div>
      <div class="card">
        <h2>🗄️ 货架状态 <span class="cnt" id="c-rack">—</span></h2>
        <div class="body"><div class="racks" id="racks"><div class="empty">暂无库位数据</div></div></div>
      </div>

      <div class="card">
        <h2>🚗 设备 <span class="cnt" id="c-dev">—</span></h2>
        <div class="body" id="devs"><div class="empty">暂无设备上报</div></div>
      </div>

      <div class="card">
        <h2>🎮 手动操作</h2>
        <div class="body">
          <div class="ops">
            <select id="o-target"><option value="car-01">小车 car-01</option><option value="nx-01">无人机 nx-01</option></select>
            <select id="o-cmd">
              <option value="goto_pick">派车取货</option>
              <option value="goto_deliver">派车送达</option>
              <option value="ask_slot">问库位</option>
              <option value="start">唤醒设备</option>
            </select>
            <input id="o-site" value="1" size="3" placeholder="站点">
            <input id="o-slot" value="1A" size="4" placeholder="库位">
            <button class="b p" onclick="sendCmd()">发送指令</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 右列 -->
    <div>
      <div class="card">
        <h2>📋 包裹列表 <span class="cnt" id="c-parcel">—</span></h2>
        <div class="body"><div class="parcels" id="parcels"><div class="empty">暂无包裹</div></div></div>
      </div>

      <div class="card">
        <h2>📜 事件记录 <span class="cnt">最近 40 条</span></h2>
        <div class="body" style="padding-top:6px;padding-bottom:6px">
          <div class="log" id="log"><div>等待事件…</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">车-机协同末端配送系统 · 陈嘉誉 · 每 2 秒自动刷新</div>
</div>

<script>
const API = "";                      // 同源部署留空
let THEME = localStorage.getItem("theme") || "cainiao";

function applyTheme(t){
  document.body.setAttribute("data-theme", t);
  document.getElementById("thbtn").textContent = (t==="cainiao" ? "🌙 深色" : "☀️ 亮色");
  localStorage.setItem("theme", t); THEME = t;
}
function toggleTheme(){ applyTheme(THEME==="cainiao" ? "dark" : "cainiao"); }
applyTheme(THEME);

const CN = {DONE:"已送达", PENDING_PICK:"待取货", DISPATCHED:"已派单",
            PICKING:"取货中", DELIVERING:"配送中", FAILED:"失败"};

function fmtTs(ts){
  if(!ts) return "-";
  const d=new Date(ts*1000), p=n=>String(n).padStart(2,"0");
  return p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}
function dur(t){
  if(!t) return "-";
  const s=Math.floor(Date.now()/1000-t);
  if(s<60) return s+" 秒"; if(s<3600) return Math.floor(s/60)+" 分"; return Math.floor(s/3600)+" 小时";
}

async function load(){
  try{
    const r = await fetch(API+"/api/status"); if(!r.ok) throw 0;
    render(await r.json());
  }catch(e){ /* 静默，下轮再试 */ }
  loadEvents();
}

function render(d){
  const s=d.stats||{}, devs=d.devices||[], slots=d.slots||[], tasks=d.tasks||[];
  const kw=(document.getElementById("q").value||"").trim().toUpperCase();

  document.getElementById("m-dev").textContent   = devs.length;
  document.getElementById("m-queue").textContent = d.queue_size ?? 0;
  document.getElementById("m-total").textContent = s.tasks_total ?? 0;
  document.getElementById("m-done").textContent  = s.tasks_done ?? 0;
  document.getElementById("m-avg").textContent   = (s.avg_duration_sec==null ? "—" : s.avg_duration_sec+" 秒");

  // 货架
  document.getElementById("c-rack").textContent = slots.length + " 个库位";
  document.getElementById("racks").innerHTML = slots.length ? slots.map(x=>{
    const occ = !!x.occupied;
    return `<div class="rack ${occ?"occ":"free"}">
      <div class="rn">${x.slot_id}</div>
      <div class="ri">${occ?"📦":"▫️"}</div>
      <div class="rd">${occ?("在库 "+(x.count||1)+" 件"):"空"}</div>
    </div>`;
  }).join("") : '<div class="empty">暂无库位数据</div>';

  // 设备
  document.getElementById("c-dev").textContent = devs.length + " 台";
  document.getElementById("devs").innerHTML = devs.length ? devs.map(x=>{
    const st = x.status==="idle" ? "idle" : (x.status==="busy" ? "busy" : "off");
    const cn = x.status==="idle" ? "空闲" : (x.status==="busy" ? "忙碌中" : "离线");
    return `<div class="dev">
      <div><span class="dn">${x.device_id}</span><span class="dr">${x.role==="car"?"小车":"无人机"}</span></div>
      <div style="font-size:12.5px"><span class="dot ${st}"></span>${cn}</div>
    </div>`;
  }).join("") : '<div class="empty">暂无设备上报</div>';

  // 包裹卡片
  const list = kw ? tasks.filter(t=>String(t.task_id).toUpperCase().includes(kw)||String(t.slot||"").toUpperCase().includes(kw)) : tasks;
  document.getElementById("c-parcel").textContent = list.length + " 个";
  document.getElementById("parcels").innerHTML = list.length ? list.map(t=>{
    const el = (t.delivered_at && t.created_at) ? (t.delivered_at-t.created_at)+" 秒" : dur(t.created_at);
    return `<div class="parcel">
      <div class="ph"><span class="pid">📦 ${t.task_id}</span>
        <span class="st ${t.status}">${CN[t.status]||t.status}</span></div>
      <div class="pb">
        <div class="code">取件 ${t.slot||"?"}-${String(t.task_id).slice(-4)}</div>
        <div class="meta">
          <span>站点 <b>${t.site|| "-"}</b></span>
          <span>库位 <b>${t.slot|| "-"}</b></span>
          <span>${t.count||1} 件</span>
          <span>车 <b>${t.car_id|| "待分配"}</b></span>
          <span>用时 <b>${el}</b></span>
        </div>
      </div></div>`;
  }).join("") : '<div class="empty">暂无包裹记录</div>';
}

async function loadEvents(){
  try{
    const list = await (await fetch(API+"/api/events?limit=40")).json();
    if(!list.length) return;
    document.getElementById("log").innerHTML = list.map(e=>
      `<div><span class="t">${fmtTs(e.ts)}</span><span class="dv">${e.device}</span><span class="ev">${e.event}</span></div>`
    ).join("");
  }catch(e){}
}

async function sendCmd(){
  const body={ target:document.getElementById("o-target").value,
               cmd:document.getElementById("o-cmd").value,
               site:document.getElementById("o-site").value,
               slot:document.getElementById("o-slot").value, count:1 };
  try{
    const j = await (await fetch(API+"/api/cmd",{method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)})).json();
    toast(j.ok ? "✅ 指令已发出" : ("⚠️ "+(j.detail||"失败")));
  }catch(e){ toast("⚠️ 请求失败"); }
  load();
}
function toast(msg){
  const d=document.createElement("div");
  d.textContent=msg;
  d.style.cssText="position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--primary);color:#fff;padding:9px 20px;border-radius:8px;font-size:13px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.2)";
  document.body.appendChild(d); setTimeout(()=>d.remove(), 2200);
}
document.getElementById("q").addEventListener("input", load);

load();
setInterval(load, 2000);
</script>
</body>
</html>
